<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %}</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 24px 16px;
      background: #f6f5f8;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Arial,
        sans-serif;
      color: #1c1b1f;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr>
        <td align="center">
          <table
            width="560"
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="
              max-width: 560px;
              width: 100%;
              background: white;
              border: 1px solid #ece6f0;
              border-radius: 20px;
            "
          >
            <tr>
              <td style="padding: 28px 32px 20px">
                <table width="100%">
                  <tr>
                    <td width="52" valign="middle">
                      <div
                        style="
                          width: 48px;
                          height: 48px;
                          line-height: 48px;
                          border-radius: 14px;
                          background: #6750a4;
                          text-align: center;
                          font-size: 22px;
                          color: white;
                        "
                      >
                        📋
                      </div>
                    </td>

                    <td valign="middle">
                      <div style="font-size: 24px; font-weight: 700">
                        Trello Clone
                      </div>

                      <div
                        style="font-size: 14px; margin-top: 4px; color: #625b71"
                      >
                        Organize your work beautifully.
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 0 32px 28px">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 20px;
                  border-top: 1px solid #ece6f0;
                  text-align: center;
                  font-size: 13px;
                  color: #625b71;
                "
              >
                Need help?<br />

                <a
                  href="mailto:support@example.com"
                  style="color: #6750a4; text-decoration: none"
                >
                  support@example.com
                </a>

                <div style="margin-top: 10px">© 2026 Trello Clone</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
